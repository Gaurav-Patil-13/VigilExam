services:
  - type: web
    name: vigilexam-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: vigilexam
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_BOOTSTRAP_KEY
        sync: false
      - key: VIGILEXAM_JWT_SECRET
        generateValue: true
      - key: ALLOW_VSCODE_DURING_DEVELOPMENT
        value: "false"
      - key: ALLOW_BACKGROUND_PROCESSES
        value: "false"
